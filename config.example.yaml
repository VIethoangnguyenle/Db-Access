databases:
  oracle_prod:
    type: oracle
    host: 127.0.0.1
    port: 1521
    service: XEPDB1
    user: ${PROD_USER}
    password: ${PROD_PASS}

  # Ví dụ DB qua SSH tunnel — tương đương:
  #   ssh -N -L <auto>:127.0.0.1:18789 ssh-user@xx.xxx.xx.xx
  # KHÔNG khai privateKey → server spawn `ssh` hệ thống, dùng ~/.ssh/config,
  # default key, ssh-agent sẵn có của máy (giống lệnh ssh bạn vẫn chạy tay).
  # oracle_via_ssh:
  #   type: oracle
  #   host: 127.0.0.1        # nhìn từ phía bastion (đầu xa của -L)
  #   port: 18789
  #   service: XEPDB1
  #   user: ${PROD_USER}
  #   password: ${PROD_PASS}
  #   ssh:
  #     host: xx.xxx.xx.xx
  #     user: ssh-user
  #     # port: 22
  #     # privateKey: ~/.ssh/id_rsa   # khai nếu muốn dùng ssh2 + key cụ thể

  # PostgreSQL — bắt buộc khai `database` (không dùng `service`).
  # pg_analytics:
  #   type: postgres
  #   host: 127.0.0.1
  #   port: 5432
  #   database: analytics
  #   user: ${PG_USER}
  #   password: ${PG_PASS}
  #   # ssh: { host: xx.xxx.xx.xx, user: ssh-user }   # tunnel giống Oracle

  # MongoDB — bắt buộc khai `database`.
  # mongo_logs:
  #   type: mongo
  #   host: 127.0.0.1
  #   port: 27017
  #   database: logs
  #   user: ${MONGO_USER}
  #   password: ${MONGO_PASS}

  # Redis — kết nối qua `sentinels`+`master` HOẶC `host`+`port` trực tiếp.
  # Giá trị mã hoá: khai `valueCodec` / `passwordCodec` là một CHUỖI bước codec
  # (plugin, KHÔNG hardcode thuật toán). Codec dựng sẵn: aes, java, json, utf8,
  # base64, hex, gunzip, inflate. Thêm hệ khác = registerCodec() trong
  # src/drivers/redis/codec, không sửa tool.
  # redis_cache:
  #   type: redis
  #   sentinels: "10.0.0.1:26379,10.0.0.2:26379,10.0.0.3:26379"   # hoặc: host/port
  #   master: mymaster
  #   db: 0
  #   keyPrefix: "myapp:"      # mọi key/pattern bị ép về trong prefix này
  #   password: ${REDIS_PASSWORD}
  #   # Password là ciphertext? Giải bằng chuỗi codec (vd base64 -> AES/CTR -> utf8):
  #   passwordCodec:
  #     - { codec: base64 }
  #     - { codec: aes, mode: ctr, key: "${REDIS_CONFIG_KEY}", keyHash: none, iv: prefix }
  #     - { codec: utf8 }
  #   # Value mã hoá rồi Java-serialize (vd AES/CBC IV=0, key=sha256(secret)).
  #   # Một chuỗi: dùng `valueCodec`. Nếu DB trộn nhiều định dạng (vd security-cache
  #   # AES+java LẪN non-security-cache JSON thuần) thì khai `valueCodecs` (nhiều
  #   # chuỗi ứng viên): thử lần lượt, chuỗi nào decode không lỗi thì lấy.
  #   valueCodecs:
  #     - [ { codec: aes, mode: cbc, key: "${REDIS_SECRET_KEY}", keyHash: sha256, iv: zero }, { codec: java } ]
  #     - [ { codec: json } ]
sources:
  agent_a:
    apiKey: ${KEY_A}
    # access: mỗi dự án chỉ khai những DB nó dùng. Hai dạng:
    #   - rút gọn:  <dbName>: [capabilities]
    #   - đầy đủ:   <dbName>: { capabilities: [...], description: "..." }
    # `description` được trả về trong list_databases để agent biết DB dùng làm gì.
    access:
      oracle_prod:
        capabilities: [read]
        description: "DB bán hàng: đơn hàng, khách hàng (chỉ đọc)"
      # mongo_logs: [read]   # dạng rút gọn vẫn dùng được

  # Triển khai 2 máy: Máy A chạy server + giữ tunnel; Máy B kết nối DB QUA Máy A.
  # Mỗi máy/agent một source + apiKey riêng để thu hồi/giới hạn quyền độc lập.
  # Xem README mục "Triển khai 2 máy".
  #
  # MỘT source có thể cấp NHIỀU DB (oracle + postgres + mongo) — Máy B chỉ mở 1
  # kết nối MCP là dùng được tất cả. Quyền siết theo từng DB độc lập:
  #   list_databases chỉ trả về 3 DB dưới đây; sql_write trên oracle_prod (chỉ
  #   read) bị từ chối, nhưng trên pg_analytics (read+write) thì được.
  # agent_b:               # agent từ Máy B (client từ xa) → http://<MÁY_A_IP>:3000/mcp
  #   apiKey: ${KEY_B}
  #   access:
  #     oracle_prod:  { capabilities: [read],        description: "DB prod (chỉ đọc) cho Máy B" }
  #     pg_analytics: { capabilities: [read, write], description: "DB phân tích" }
  #     mongo_logs:   [read]    # dạng rút gọn vẫn dùng được
